<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Episodes - GameHub</title>
<link rel="stylesheet" href="ui.css">
<script src="auth.js"></script><script src="login-guard.js"></script><script src="shell.js"></script></head><body>
<main class="page">
  <section class="hero"><div><a class="btn" href="tv.html">← Movies & TV</a><h1 id="showTitle">Loading...</h1><p class="muted" id="showDesc">Pick a season and episode.</p></div></section>
  <section class="card card-pad">
    <div class="section-head"><div><h2>Episodes</h2><p class="muted" id="episodeCount">loading...</p></div><input id="episodeSearch" class="search" placeholder="Search episodes..."></div>
    <div id="seasonList"><p class="muted">loading episodes...</p></div>
  </section>
</main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const id=new URLSearchParams(location.search).get('id')||'';
let db=null,show=null,q='';
function render(){
  if(!show){showTitle.textContent='Show not found';seasonList.innerHTML='<p class="muted">This TV show does not exist.</p>';return}
  showTitle.textContent=show.title||show.id||'TV Show';
  showDesc.textContent=show.description||'Pick a season and episode.';
  const seasons=Array.isArray(show.seasons)?show.seasons:[];
  const total=seasons.reduce((n,s)=>n+(Array.isArray(s.episodes)?s.episodes.length:0),0);
  episodeCount.textContent=seasons.length+' seasons · '+total+' episodes';
  seasonList.innerHTML=seasons.map((season,si)=>{
    const eps=(Array.isArray(season.episodes)?season.episodes:[]).filter(ep=>[ep.title,ep.url,ep.description,ep.episode].join(' ').toLowerCase().includes(q.toLowerCase()));
    if(!eps.length&&q)return '';
    return `<section class="season-box"><h3>${esc(season.title||('Season '+(season.season||si+1)))}</h3><div class="episode-list">${eps.map((ep,ei)=>`<a class="episode-row" href="media.html?id=${encodeURIComponent(show.id)}&season=${encodeURIComponent(season.season||si+1)}&episode=${encodeURIComponent(ep.episode||ei+1)}"><span class="media-pill">E${esc(ep.episode||ei+1)}</span><span><b>${esc(ep.title||('Episode '+(ep.episode||ei+1)))}</b><br><small class="muted">${esc(ep.description||'')}</small></span><span class="btn">Play</span></a>`).join('')}</div></section>`;
  }).join('')||'<p class="muted">No episodes found.</p>';
}
document.addEventListener('fg-auth-ready',async()=>{await FGAuth.initFirebase();db=FGAuth.db();db.ref('homepageAdmin/media/'+id).on('value',s=>{show=s.val()||null;render()});});
episodeSearch.oninput=e=>{q=e.target.value||'';render()};
</script></body></html>
